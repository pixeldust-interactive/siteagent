name: PHP validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.0"
          - "8.4"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Validate source
        run: ./bin/validate.sh
      - name: Build release ZIP
        run: ./bin/build.sh
      - name: Inspect release ZIP
        run: |
          test "$(unzip -Z1 dist/site-agent-*.zip | sed -n 's#^\([^/]*\)/.*#\1#p' | sort -u)" = "site-agent"
          ! unzip -Z1 dist/site-agent-*.zip | grep -E '(^|/)(\.git|\.github|tests|docs|bin)(/|$)'
